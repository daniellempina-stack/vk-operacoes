<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Calçados — Operações</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.logo-area{text-align:center;margin-bottom:2.5rem}
.logo-area span{display:block;font-size:12px;color:#C9A24B;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.logo-area h1{font-size:28px;font-weight:700;color:#1F2D3D}
.logo-area p{font-size:14px;color:#6b7a8d;margin-top:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;width:100%;max-width:560px}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e2e5ea;border-radius:14px;padding:2rem 1.5rem;text-align:center;text-decoration:none;color:inherit;transition:all .2s;cursor:pointer}
.card:hover{border-color:#1F2D3D;transform:translateY(-3px);box-shadow:0 8px 24px rgba(31,45,61,.1)}
.card-icon{font-size:40px;margin-bottom:1rem}
.card-title{font-size:17px;font-weight:700;color:#1F2D3D;margin-bottom:.5rem}
.card-desc{font-size:13px;color:#6b7a8d;line-height:1.5}
.card-btn{display:inline-block;margin-top:1.25rem;background:#1F2D3D;color:#fff;padding:8px 22px;border-radius:7px;font-size:13px;font-weight:600}
.card:hover .card-btn{background:#C9A24B}
.footer{margin-top:2rem;font-size:12px;color:#9aa5b4;text-align:center}
</style>
</head>
<body>

<div class="logo-area">
  <span>Grupo VK Calçados</span>
  <h1>Portal de Operações</h1>
  <p>Selecione o sistema que deseja acessar</p>
</div>

<div class="cards">
  <a href="suprimentos.html" class="card">
    <div class="card-icon">📦</div>
    <div class="card-title">Suprimentos</div>
    <div class="card-desc">Pedidos de materiais, embalagens e controle de estoque</div>
    <div class="card-btn">Acessar →</div>
  </a>
  <a href="manutencao.html" class="card">
    <div class="card-icon">🔧</div>
    <div class="card-title">Manutenção</div>
    <div class="card-desc">Abertura de chamados, orçamentos e acompanhamento de reparos</div>
    <div class="card-btn">Acessar →</div>
  </a>
</div>

<div class="footer">Grupo VK Calçados · Uso interno</div>

</body>
</html>
